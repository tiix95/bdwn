# bdwn - reference sshd drop-in for the backup repository user.
# setup-backup-user.sh installs this automatically to
# /etc/ssh/sshd_config.d/bdwn-backup.conf. It is shown here for review.
#
# Requires the main sshd_config to keep the default Debian line:
#     Include /etc/ssh/sshd_config.d/*.conf
#
# Restricts the 'backup' user to SFTP only, chrooted to /srv/backups/backup,
# with no shell, no command execution and no forwarding of any kind.

Match User backup
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ChrootDirectory /srv/backups/%u
    ForceCommand internal-sftp
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
