# bdwn - reference sshd drop-in for the backup repository users.
# setup-backup-user.sh installs this automatically to
# /etc/ssh/sshd_config.d/bdwn-backup.conf. It is shown here for review.
#
# Requires the main sshd_config to keep the default Debian line:
#     Include /etc/ssh/sshd_config.d/*.conf
#
# Restricts every member of the 'bdwn' group to SFTP only, chrooted to the
# shared /backups/servers jail, with no shell, no command execution and no
# forwarding of any kind. Each server user can only write its own
# /backups/servers/<SERVER_NAME> dir (mode 0700).

# AllowGroups inside the Match block overrides a global AllowGroups (if any)
# for the backup users only; without it, a hardened sshd_config listing other
# groups would reject them at login.

Match Group bdwn
    AllowGroups bdwn
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ChrootDirectory /backups/servers
    ForceCommand internal-sftp
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
