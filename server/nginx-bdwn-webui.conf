# Reverse proxy for bdwn-webui, to copy as /etc/nginx/sites-available/bdwn-webui
# and adapt (listen address, server_name, certificates, allowed networks).
#
# bdwn-webui already sends its own Content-Security-Policy, X-Frame-Options,
# X-Content-Type-Options and Referrer-Policy. Do NOT add them here: add_header
# does not replace the backend header, it duplicates it, and a browser given
# two Content-Security-Policy headers applies the intersection of both, which
# breaks the page. Only HSTS is added, since the application cannot know it is
# served over TLS.
#
# Setup:
#   adduser www-data bdwn-webui         # the socket is 0660 bdwn-webui:bdwn-webui
#   apt install apache2-utils
#   htpasswd -B -c /etc/nginx/bdwn-webui.htpasswd admin
#   chown root:www-data /etc/nginx/bdwn-webui.htpasswd
#   chmod 0640 /etc/nginx/bdwn-webui.htpasswd
#   ln -s ../sites-available/bdwn-webui /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Matching nftables rule:
#   iifname $main_if ip daddr $main_ip ip saddr 192.168.7.0/24 tcp dport 443 \
#       ct state new counter accept comment "bdwn-webui"

# Included from the http block, so upstream and limit_req_zone belong here.
upstream bdwn_webui {
    server unix:/run/bdwn-webui/bdwn-webui.sock;
    keepalive 2;
}

# Room for the refresh button without letting anyone hammer the page. The
# report is cached server side anyway, and a forced scan is floored at one
# every 10 seconds by bdwn-webui itself.
limit_req_zone $binary_remote_addr zone=bdwn_webui:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=bdwn_webui_conn:1m;

server {
    listen      192.168.7.104:443 ssl;
    http2       on;
    server_name backup.example.com;

    # --- TLS (Mozilla intermediate) ---------------------------------------
    ssl_certificate         /etc/ssl/certs/bdwn-webui.crt;
    ssl_certificate_key     /etc/ssl/private/bdwn-webui.key;
    ssl_protocols           TLSv1.3 TLSv1.2;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:BdwnTLS:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # --- Access control ---------------------------------------------------
    # The page has no authentication of its own: this is the only gate.
    allow 192.168.7.0/24;
    deny  all;

    auth_basic           "bdwn backup status";
    auth_basic_user_file /etc/nginx/bdwn-webui.htpasswd;

    # Client certificates signed by the internal CA, instead of (or on top of)
    # basic auth. Strongest option, no password to rotate.
    # ssl_client_certificate /etc/ssl/certs/internal-ca.crt;
    # ssl_verify_client      on;

    # --- Hardening --------------------------------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size   1k;    # nothing is ever uploaded here
    client_body_timeout    10s;
    client_header_timeout  10s;
    limit_conn bdwn_webui_conn 8;

    access_log /var/log/nginx/bdwn-webui.access.log;
    error_log  /var/log/nginx/bdwn-webui.error.log warn;

    # --- Proxy defaults, inherited by every location ----------------------
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    # The first request after a restart rebuilds the cache by walking every
    # repository: leave it room on a large server.
    proxy_read_timeout 120s;
    proxy_buffering    off;

    location = / {
        limit_req zone=bdwn_webui burst=5 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://bdwn_webui;
    }

    location = /api/status {
        limit_req zone=bdwn_webui burst=5 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://bdwn_webui;
    }

    # Scraped by Prometheus only: its own IP, no password prompt.
    location = /metrics {
        allow 192.168.7.20;
        deny  all;
        auth_basic off;
        limit_except GET { deny all; }
        proxy_pass http://bdwn_webui;
    }

    # Nothing else exists in this application.
    location / { return 404; }
}

# Drop this block entirely if port 80 is closed at the firewall.
server {
    listen      192.168.7.104:80;
    server_name backup.example.com;
    return 301  https://$host$request_uri;
}
