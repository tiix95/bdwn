# Drop-in for bdwn-webui.service, needed only when BDWN_WEBUI_LISTEN is a TCP
# address instead of the default unix socket. Install it with:
#   install -d -m 0755 /etc/systemd/system/bdwn-webui.service.d
#   cp /usr/share/bdwn-server/webui-tcp-dropin.conf.example \
#      /etc/systemd/system/bdwn-webui.service.d/tcp.conf
#   systemctl daemon-reload && systemctl restart bdwn-webui
#
# The page has no authentication of its own: bind it to 127.0.0.1 and put a
# reverse proxy with TLS in front, or keep the unix socket. Use a port above
# 1024, the service holds no CAP_NET_BIND_SERVICE.
[Service]
PrivateNetwork=no
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
