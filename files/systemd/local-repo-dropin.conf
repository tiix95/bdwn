# Drop-in allowing bdwn.service to write a local restic repository
# (BDWN_REPO set to a filesystem path instead of sftp:...). Only needed for
# local repositories:
#   install -d /etc/systemd/system/bdwn.service.d
#   cp /usr/share/bdwn/local-repo-dropin.conf.example /etc/systemd/system/bdwn.service.d/local-repo.conf
#   <edit ReadWritePaths below to match BDWN_REPO>
#   systemctl daemon-reload
[Service]
# ProtectSystem=strict makes the whole filesystem read-only for the service;
# the repository directory must be explicitly writable. Adjust to the parent
# directory of BDWN_REPO in /etc/bdwn/bdwn.conf.
ReadWritePaths=/srv/backups
