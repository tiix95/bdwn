# Drop-in relaxing the bdwn.service hardening just enough for ZFS exports
# (BDWN_ZFS_DATASETS). Only needed when ZFS backup is enabled:
#   install -d /etc/systemd/system/bdwn.service.d
#   cp /usr/share/bdwn/zfs-dropin.conf.example /etc/systemd/system/bdwn.service.d/zfs.conf
#   systemctl daemon-reload
[Service]
# zfs snapshot/send/destroy talk to the kernel through /dev/zfs and need
# admin privileges. PrivateDevices must be off to expose the node; the
# DeviceAllow list keeps the device view minimal (setting any DeviceAllow
# closes the policy, so the standard nodes must be re-allowed too).
PrivateDevices=no
DeviceAllow=/dev/zfs rw
DeviceAllow=/dev/null rw
DeviceAllow=/dev/zero rw
DeviceAllow=/dev/urandom r
DeviceAllow=/dev/random r
# Merged with the CapabilityBoundingSet of the main unit
CapabilityBoundingSet=CAP_SYS_ADMIN
# Dump directory (parent of the default BDWN_ZFS_DUMP_DIR); adjust if you
# override BDWN_ZFS_DUMP_DIR in /etc/bdwn/bdwn.conf.
ReadWritePaths=/var/backups/bdwn
