# /etc/bdwn/bdwn-export.conf - configuration for 'bdwn-export' on the backup
# server. Sourced by /usr/bin/bdwn-export: plain shell syntax, no spaces
# around '='. Every key is optional, the file itself is optional.
# It holds no passphrase: the backup server never sees them.

# Chroot jail holding one restic repository per backup client, as created by
# bdwn-setup-backup-user (optional; defaults to /backups/servers).
# Must match CHROOT_BASE if you changed it when setting up the users.
# BDWN_SERVER_ROOT="/backups/servers"

# UUID of the external device receiving the mirror (optional). Used when
# 'bdwn-export' is called without --target: the device is mounted, mirrored
# to, then unmounted. Required by bdwn-export.service, which takes no argument.
# Find it with: lsblk -o NAME,SIZE,FSTYPE,UUID
# BDWN_EXPORT_UUID="1234abcd-56ef-78ab-90cd-1234567890ab"

# Mount point used for BDWN_EXPORT_UUID (optional; defaults to /mnt/bdwn-export).
# BDWN_EXPORT_MOUNT="/mnt/bdwn-export"

# Directory created on the external device to hold the repositories
# (optional; defaults to bdwn-repos). One subdirectory per backup client.
# BDWN_EXPORT_SUBDIR="bdwn-repos"
