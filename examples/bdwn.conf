# /etc/bdwn/bdwn.conf - configuration for bdwn backups.
# Sourced by /usr/bin/bdwn: plain shell syntax, no spaces around '='.
# Mode 0600, owner root:root. Contains the encryption passphrase: keep it secret.

# Restic repository, remote (SFTP) or local (filesystem path).
# SFTP format: sftp:<ssh-host>:/<SERVER_NAME>
# <ssh-host> refers to a Host entry in /var/lib/bdwn/.ssh/config.
# The SFTP account is chrooted to /backups/servers on the backup server, so
# the path is just /<SERVER_NAME> as created by setup-backup-user.sh.
BDWN_REPO="sftp:backup-remote:/server-hostname"

# Local repository: an absolute path on this machine (mounted disk, NFS...).
# Requires the systemd drop-in making the path writable (see README,
# Local repository section). No SSH setup is needed in this mode.
# BDWN_REPO="/srv/backups/restic"

# Encryption passphrase for the restic repository. Choose a strong one.
RESTIC_PASSWORD="change-me-to-a-strong-passphrase"

# Space-separated list of directories/files to back up.
# The service runs as root (with read-only capabilities), so any path works.
BACKUP_PATHS="/etc /var/www /home"

# Space-separated exclude patterns (optional).
BDWN_EXCLUDES="*.tmp /home/*/.cache"

# Space-separated ZFS pools/datasets/volumes to back up (optional).
# Each entry is snapshotted recursively, every dataset below it is exported
# with 'zfs send' to a dump file, and the dump directory is included in the
# restic backup. Dump files are removed after the backup.
# Requires zfsutils-linux and the systemd drop-in (see README, ZFS section).
# BDWN_ZFS_DATASETS="tank tank/vms/disk1"

# Directory receiving the ZFS dump files (optional).
# If you change it, adjust ReadWritePaths in the systemd drop-in accordingly.
# BDWN_ZFS_DUMP_DIR="/var/backups/bdwn/zfs"

# Retention applied after each backup (optional; leave unset to keep everything).
BDWN_KEEP_DAILY="7"
BDWN_KEEP_WEEKLY="4"
BDWN_KEEP_MONTHLY="6"

# Restic cache directory (optional; defaults to /var/cache/bdwn).
# BDWN_CACHE_DIR="/var/cache/bdwn"

# Default target directory for 'bdwn restore' (optional; defaults to
# /var/backups/bdwn/restore, which 'apt purge bdwn' removes).
# Overridden per run with 'bdwn restore --target DIR'.
# BDWN_RESTORE_DIR="/var/backups/bdwn/restore"

# 'bdwn export' only: UUID of the external device receiving the repository
# mirror (optional). Used when 'bdwn export' is called without a directory:
# bdwn mounts /dev/disk/by-uuid/<UUID>, mirrors the repository, unmounts.
# Find it with: lsblk -o NAME,SIZE,FSTYPE,UUID
# BDWN_EXPORT_UUID="1234abcd-56ef-78ab-90cd-1234567890ab"

# Mount point used for BDWN_EXPORT_UUID (optional; defaults to /mnt/bdwn-export).
# BDWN_EXPORT_MOUNT="/mnt/bdwn-export"

# Directory created on the external device to hold the mirror
# (optional; defaults to bdwn-repo).
# BDWN_EXPORT_SUBDIR="bdwn-repo"

# bdwn-libvirt only: seconds to wait for a clean VM shutdown before aborting
# the backup and restarting the VM (optional; defaults to 300).
# BDWN_LIBVIRT_SHUTDOWN_TIMEOUT="300"

# bdwn-libvirt only: how the snapshot overlay is merged back after the export
# (optional; defaults to auto).
#   auto  merge live (blockcommit), fall back to a cold merge if refused
#   live  live merge only, fail if refused
#   cold  cold merge only: stop the VM, qemu-img commit, restart it
# A live merge needs qemu to reopen the base image read-write, which AppArmor
# denies on most Debian hosts; the cold merge adds a second short downtime.
# BDWN_LIBVIRT_MERGE_MODE="auto"
