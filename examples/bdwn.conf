# /etc/bdwn/bdwn.conf - configuration for bdwn backups.
# Sourced by /usr/bin/bdwn: plain shell syntax, no spaces around '='.
# Mode 0600, owner root:root. Contains the encryption passphrase: keep it secret.

# Restic repository on the remote SFTP server.
# Format: sftp:<ssh-host>:/<SERVER_NAME>
# <ssh-host> refers to a Host entry in /var/lib/bdwn/.ssh/config.
# The SFTP account is chrooted to /backups/servers on the backup server, so
# the path is just /<SERVER_NAME> as created by setup-backup-user.sh.
BDWN_REPO="sftp:backup-remote:/$(hostname)"

# Encryption passphrase for the restic repository. Choose a strong one.
RESTIC_PASSWORD="change-me-to-a-strong-passphrase"

# Space-separated list of directories/files to back up.
# The service runs as root (with read-only capabilities), so any path works.
BACKUP_PATHS="/etc /var/www /home"

# Space-separated exclude patterns (optional).
BDWN_EXCLUDES="*.tmp /home/*/.cache"

# Space-separated ZFS pools/datasets/volumes to back up (optional).
# Each entry is snapshotted recursively, every dataset below it is exported
# with 'zfs send' to a dump file, and the dump directory is included in the
# restic backup. Dump files are removed after the backup.
# Requires zfsutils-linux and the systemd drop-in (see README, ZFS section).
# BDWN_ZFS_DATASETS="tank tank/vms/disk1"

# Directory receiving the ZFS dump files (optional).
# If you change it, adjust ReadWritePaths in the systemd drop-in accordingly.
# BDWN_ZFS_DUMP_DIR="/var/backups/bdwn/zfs"

# Retention applied after each backup (optional; leave unset to keep everything).
BDWN_KEEP_DAILY="7"
BDWN_KEEP_WEEKLY="4"
BDWN_KEEP_MONTHLY="6"

# Restic cache directory (optional; defaults to /var/cache/bdwn).
# BDWN_CACHE_DIR="/var/cache/bdwn"
