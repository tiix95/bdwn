# /etc/bdwn/bdwn-webui.conf - configuration of the status web UI on the backup
# server. Same plain shell syntax as the other bdwn config files: no spaces
# around '='. Every key is optional, and so is the file itself.
# It holds no passphrase: the web UI never opens a repository.

# Chroot jail holding one restic repository per backup client, as created by
# bdwn-setup-backup-user (optional; defaults to /backups/servers).
# Must match CHROOT_BASE if you changed it when setting up the users.
# BDWN_SERVER_ROOT="/backups/servers"

# Where the web UI listens (optional; defaults to the unix socket below).
# Either a unix socket, to be reached through a reverse proxy or an SSH
# forward, or a TCP address. A TCP address also needs the drop-in shipped in
# /usr/share/bdwn-server/webui-tcp-dropin.conf.example, since the service runs
# with PrivateNetwork=yes by default.
# BDWN_WEBUI_LISTEN="unix:/run/bdwn-webui/bdwn-webui.sock"
# BDWN_WEBUI_LISTEN="127.0.0.1:8080"

# Mode of the unix socket (optional; defaults to 0660). The socket belongs to
# the bdwn-webui user and group: add the proxy user to that group to let it in
#   adduser www-data bdwn-webui
# BDWN_WEBUI_SOCKET_MODE="0660"

# Seconds a scan is kept before being redone (optional; defaults to 300).
# A scan walks every file of every repository, so keep it well above a few
# seconds on a large server. The page reloads itself at this interval.
# BDWN_WEBUI_CACHE_TTL="300"

# Age of the last snapshot, in hours, above which a repository is shown as
# late, then as stale (optional; default 26 and 72). 26 leaves room for the
# daily timer of the clients to drift.
# BDWN_WEBUI_STALE_HOURS="26"
# BDWN_WEBUI_CRITICAL_HOURS="72"
